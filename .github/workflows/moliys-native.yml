name: Build 沫离影视壳子 (原生主干)

on:
  workflow_dispatch:
  push:
    branches:
      - moliys-native

permissions:
  contents: read

jobs:
  build:
    name: Build 沫离壳子 原生主干 arm64+arm32 release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install required SDK & verify
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }

          sdkmanager() { "$SDKMANAGER" "$@"; }

          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "platform-tools"

          test -d "$SDK_ROOT/platforms/android-33" \
            || { echo "::error::platforms;android-33 未安装"; exit 1; }

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Verify signing material
        run: |
          test -f .key/app-release.jks || { echo "::error::缺少 .key/app-release.jks"; exit 1; }
          for k in RELEASE_STORE_FILE RELEASE_KEY_ALIAS RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            grep -q "^$k=" gradle.properties || { echo "::error::gradle.properties 缺少 $k"; exit 1; }
          done

      - name: Build release APK
        run: ./gradlew assembleJavaRelease --no-daemon --stacktrace

      - name: Verify APK carries both ARM ABIs
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::找不到 release APK"; exit 1; }
          echo "APK=$APK size=$(stat -c%s "$APK")"
          unzip -l "$APK" | awk '{print $4}' > /tmp/apk_entries.txt
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libplayer.so libijksdl.so libxl_thunder_sdk.so libp2p.so; do
              grep -qx "lib/$abi/$lib" /tmp/apk_entries.txt || { echo "::error::$abi 缺少 $lib"; exit 1; }
            done
            echo "  $abi: 原生库齐全"
          done
          md5sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moliys-native-arm
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
